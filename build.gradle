plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com/'
        content {
            includeGroup 'mezz.jei'
            includeGroup 'net.mezzdev.config'
        }
    }
    flatDir {
        dirs 'libs'
    }
}

sourceSets {
    devfix {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        "${mod_id}_devfix" {
            sourceSet(sourceSets.devfix)
        }
    }
}

neoForge.addModdingDependenciesTo(sourceSets.devfix)

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation files('libs/appliedenergistics2-26.1.12-beta.jar')
    implementation files('libs/guideme-26.1.14-beta.jar')
    implementation files('libs/thaumaturge-26.1.2-NeoForge-1.0.0.jar')

    localRuntime files('libs/lithostitched-1.8.0-neoforge-26.1.jar')
    localRuntime files('libs/curios-neoforge-15.0.0+26.1.2.jar')
    compileOnly files('libs/curios-neoforge-15.0.0+26.1.2.jar')
    compileOnly files('libs/ae2wtlib-26.1.1-beta.jar')
    compileOnly zipTree('libs/ae2wtlib-26.1.1-beta.jar').matching {
        include 'META-INF/jarjar/*ae2wtlib_api*.jar'
    }
    localRuntime files('libs/ae2wtlib-26.1.1-beta.jar')
    compileOnly files('libs/Jade-mc26.1-NeoForge-26.1.11.jar')
    localRuntime files('libs/Jade-mc26.1-NeoForge-26.1.11.jar')

    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
