modLoader = "javafml"
loaderVersion = "[4,)"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
logoFile = "logo.png"
logoBlur = false
authors = "${mod_authors}"
credits = "Original Thaumic Energistics by Chris, BrockWS and Delfayne"
description = '''${mod_description}'''

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "ae2"
type = "required"
versionRange = "[19.2.17,20.0.0)"
ordering = "AFTER"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "thaumaturge"
type = "required"
versionRange = "${thaumaturge_version_range}"
ordering = "AFTER"
side = "BOTH"


[[dependencies."${mod_id}"]]
modId = "curios"
type = "optional"
versionRange = "[9.5.0,)"
ordering = "AFTER"
side = "BOTH"

[[mixins]]
config = "appliedthaumaturge.mixins.json"

[[dependencies."${mod_id}"]]
modId = "ae2wtlib"
type = "optional"
versionRange = "[19.5.1,20.0.0)"
ordering = "AFTER"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "ae2wtlib_api"
type = "optional"
versionRange = "[19.5.1,20.0.0)"
ordering = "BEFORE"
side = "BOTH"
